<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập JINER</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    font-family: Arial, Helvetica, sans-serif;
    color: #374151;
  }
  .card {
    width: 440px;
    max-width: calc(100% - 32px);
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 38px 39px 46px;
  }
  h1 {
    margin: 0 0 24px;
    font-size: 30px;
    font-weight: 700;
    color: #111827;
  }
  label.field {
    display: block;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    height: 45px;
    padding: 0 13px;
    font-size: 17px;
    color: #111827;
    border: 1px solid #9ca3af;
    border-radius: 8px;
    outline: none;
    margin-bottom: 24px;
  }
  input::placeholder { color: #9ca3af; }
  input:focus { border-color: #e11d48; box-shadow: 0 0 0 3px rgba(225, 29, 72, .15); }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: -6px;
    font-size: 16px;
  }
  .remember { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .remember input { width: 17px; height: 17px; margin: 0; accent-color: #e11d48; }
  .forgot { color: #e11d48; text-decoration: none; margin-right: 24px; }
  .forgot:hover { text-decoration: underline; }
  button {
    width: 100%;
    height: 49px;
    margin-top: 28px;
    border: none;
    border-radius: 8px;
    background: #e11d48;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: #be123c; }
  .signup {
    margin: 32px 0 0;
    text-align: center;
    font-size: 16px;
  }
  .signup a { color: inherit; text-decoration: none; }
  .signup a:hover { color: #e11d48; text-decoration: underline; }
</style>
</head>
<body>
  <form class="card" onsubmit="return false">
    <h1>Đăng nhập JINER</h1>

    <label class="field" for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="ban@vidu.com">

    <label class="field" for="password">Mật khẩu</label>
    <input type="password" id="password" name="password" placeholder="••••••••">

    <div class="row">
      <label class="remember"><input type="checkbox" name="remember"> Ghi nhớ tôi</label>
      <a href="#" class="forgot">Quên mật khẩu?</a>
    </div>

    <button type="submit">Tiếp tục</button>

    <p class="signup">Chưa có tài khoản? <a href="#">Đăng ký</a></p>
  </form>
</body>
</html>
